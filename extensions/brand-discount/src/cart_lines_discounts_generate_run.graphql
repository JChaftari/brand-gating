# $brandTags is sourced from the discount-owner $app:brand-discount.input_variables
# metafield (see shopify.extension.toml [extensions.input.variables]).
#
# Type is nullable list ([String!]) with default [], not non-null ([String!]!).
# Shopify's input-variable resolver explicitly passes `null` to declared variables
# when the source metafield is missing — and a non-null variable rejects null at
# the variable-validation phase BEFORE any defaults can apply, aborting the entire
# function with InvalidVariableValueError (STDIN never built). Making the variable
# nullable lets validation pass; the JS handler then treats null and [] identically
# as "no brand tags configured for this discount → no-op."
#
# $brandCollectionIds comes from the same metafield, same rules. A product
# belongs to a brand if it has the brand's tag OR is in the brand's collection.
# brandTags[i] and brandCollectionIds[i] describe the same brand; the JS reads
# that metafield (discount.brandConfig) to map a collection back to its tag.
query RunInput($brandTags: [String!] = [], $brandCollectionIds: [ID!] = []) {
  cart {
    buyerIdentity {
      customer {
        brandDiscounts: metafield(namespace: "$app:brand-discount", key: "brand_discounts") {
          value
        }
      }
    }
    lines {
      id
      merchandise {
        ... on ProductVariant {
          product {
            brandTagMatches: hasTags(tags: $brandTags) {
              tag
              hasTag
            }
            brandCollectionMatches: inCollections(ids: $brandCollectionIds) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
    brandConfig: metafield(namespace: "$app:brand-discount", key: "input_variables") {
      value
    }
  }
}
