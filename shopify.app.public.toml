# Public (App Store) app configuration.
#
# This is a SEPARATE Shopify app from shopify.app.toml. That one is the
# custom-distribution app for the first customer and must not change. Same
# codebase, two apps — select which one the CLI targets with:
#
#   shopify app config use shopify.app.public.toml   (this app)
#   shopify app config use shopify.app.toml          (custom app)
#
# Or per command: shopify app deploy --config public
#
# TODO before first deploy (see docs/APP_STORE_READINESS.md):
#   1. Create the app in the Partner Dashboard (Apps → Create app → Create
#      manually), choose PUBLIC distribution, paste its client ID below.
#   2. Create the brand-gating-public Cloudflare Pages project and replace the
#      URLs below if the subdomain differs.

client_id = "REPLACE_WITH_PUBLIC_APP_CLIENT_ID"
name = "Brand Discounts"
application_url = "https://brand-gating-public.pages.dev"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  # Mandatory for App Store distribution. Handled by
  # web/functions/webhooks/compliance.js (HMAC-verified, 401 on invalid).
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://brand-gating-public.pages.dev/webhooks/compliance"

[access_scopes]
# Same as the custom app minus read_files: no image picker was built (images are
# pasted URLs), and App Store review rejects requested scopes the app doesn't use.
# See shopify.app.toml for the per-scope rationale.
scopes = "read_products,write_products,read_customers,write_customers,read_discounts,write_discounts"

[access.admin]
embedded_app_direct_api_access = true

[auth]
redirect_urls = [ "https://brand-gating-public.pages.dev/" ]
